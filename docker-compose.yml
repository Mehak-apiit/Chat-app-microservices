services:
  auth-db:
    image: mysql:8.4
    container_name: mysql-db2
    environment:
      MYSQL_DATABASE: auth_db
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_ROOT_PASSWORD: root
    command: ["mysqld", "--default-authentication-plugin=mysql_native_password"]
    ports:
      - "3307:3306"
    volumes:
      - auth-db-data:/var/lib/mysql
    networks:
      - chatapp-network
volumes:
  auth-db-data:
networks:
  chatapp-network:
    driver: bridge